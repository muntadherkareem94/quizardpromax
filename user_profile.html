        /**
         * Handles the complete logout process including session cleanup and redirection.
         */
      // ADD THIS NEW SUPABASE FUNCTION
async function handleLogout() {
    try {
        // Use the globally available 'currentUser' object
        if (currentUser) {
            // Delete the session from our custom 'active_sessions' table
            await supabase.from('active_sessions').delete().eq('user_id', currentUser.id);
        }
        // Sign out from Supabase's main auth system
        await supabase.auth.signOut();
    } catch (error) {
        console.error("Error during logout:", error);
    } finally {
        // Clear all storage and redirect to the login page
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = 'index.html';
    }
}

        /**
         * Validates the user's session against the Firestore record. Forces logout if invalid.
         * @param {object} user - The Firebase auth user object.
         * @returns {boolean} - True if the session is valid, false otherwise.
         */
     // --- In dashboard.html's <script type="module"> block ---

async function validateAndEnforceSession(user) {
    // Get the specific session ID the browser is using
    const sessionId = localStorage.getItem('sessionId');

    if (!sessionId) {
        await handleLogout();
        return false;
    }

    // Query for that ONE specific session record
    const { data: sessionData, error } = await supabase
        .from('active_sessions')
        .select('expires_at')
        .eq('user_id', user.id)
        .eq('session_id', sessionId)
        .single(); // Expect exactly one result

    if (error || !sessionData) {
        // If no session was found matching the ID, log out
        await handleLogout();
        return false;
    }

    // Check if the session is expired
    const now = new Date();
    const expiryDate = new Date(sessionData.expires_at);

    if (now > expiryDate) {
        await handleLogout();
        return false;
    }

    // If we reach here, the session is valid
    return true;
}

        /**
         * Displays the user's profile photo or a default icon.
         * @param {string|null} photoURL - The URL of the user's profile photo.
         */
        function displayProfilePhoto(photoURL) {
             if (photoURL) {
                dom.profileImageContainer.innerHTML = `<img src="${photoURL}" alt="Profile Photo" class="w-full h-full object-cover">`;
            } else {
                dom.profileImageContainer.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>`;
            }

        /**
         * Uploads a new profile photo to Firebase Storage and updates the user's profile.
         * @param {File} file - The image file to upload.
         * @param {object} user - The Firebase auth user object.
         */
      async function uploadProfilePhoto(file, user) {
    if (!file || !user) return;
    dom.uploadStatus.textContent = 'Uploading...';
    
    const fileExt = file.name.split('.').pop();
    const fileName = `${user.id}.${fileExt}`;
    const filePath = `public/${fileName}`;

    try {
        // Upload the file to Supabase Storage
        const { error: uploadError } = await supabase.storage
            .from('profile_pictures') // This should be the name of your bucket
            .upload(filePath, file, { upsert: true }); // upsert:true overwrites existing file
        
        if (uploadError) throw uploadError;

        // Get the public URL of the uploaded file
        const { data: urlData } = supabase.storage
            .from('profile_pictures')
            .getPublicUrl(filePath);
        
        const publicURL = urlData.publicUrl;

        // Update the user's metadata in Supabase Auth to store the new photo URL
        const { error: updateUserError } = await supabase.auth.updateUser({
            data: { photoURL: publicURL }
        });

        if (updateUserError) throw updateUserError;
        
        displayProfilePhoto(publicURL);
        updateUserProfileIcon(publicURL);
        dom.uploadStatus.textContent = 'Photo updated successfully!';

    } catch (error) {
        console.error("Error uploading photo:", error);
        dom.uploadStatus.textContent = 'Upload failed. Please try again.';
    }
}

        /**
         * Loads and displays the user's profile information and quiz statistics.
         * @param {object} user - The Firebase auth user object.
         */
      async function loadUserProfile(user) {
    displayProfilePhoto(user.user_metadata.photoURL); // Get photo from user metadata
    try {
        const { data: userData, error: userError } = await supabase
            .from('users')
            .select('speciality, account_type') // <-- Fetch account_type
            .eq('id', user.id)
            .single();
        if (userError) throw userError;

        // Conditionally add the premium badge to the main title
        if (userData.account_type === 'premium') {
            const profileTitleContainer = document.getElementById('profileTitleContainer');
            const premiumBadge = document.createElement('span');
            premiumBadge.className = 'bg-yellow-100 text-yellow-800 text-sm font-semibold px-2.5 py-1 rounded-full flex items-center gap-1';
           premiumBadge.innerHTML = `<img src="./images/general/crown.png" alt="Premium" class="w-4 h-4 object-contain"> Premium`;
            profileTitleContainer.appendChild(premiumBadge);
        }

        dom.userEmail.textContent = user.email;
        dom.userSpecialty.textContent = userData.speciality || 'Not specified';
        const creationTime = new Date(user.created_at);
        dom.memberSince.textContent = creationTime.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

     // Call the new RPC function to get the stats directly from the database
        const { data: stats, error: statsError } = await supabase.rpc('get_user_stats');

        if (statsError) throw statsError;

        // This improved line checks if data was returned and provides a default object if not.
        // This prevents errors if a new user has no stats yet.
        const userStats = (stats && stats.length > 0)
            ? stats[0]
            : { quizzes_completed: 0, total_questions_answered: 0, average_score: 0 };

        // Directly update the UI with the pre-calculated values
        dom.quizzesCompleted.textContent = userStats.quizzes_completed ?? 0;
        dom.totalQuestionsAnswered.textContent = userStats.total_questions_answered ?? 0;
        dom.averageScore.textContent = `${Number(userStats.average_score ?? 0).toFixed(0)}%`;

        dom.loadingStats.classList.add('hidden');
        dom.statsContainer.classList.remove('hidden');

    } catch (error) {
        console.error("Error loading user profile:", error);
        dom.loadingStats.textContent = "Could not load profile data.";
    }
}

// In user_profile.html
document.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabase.auth.getSession();

    if (session) {
        const isSessionValid = await validateAndEnforceSession(session.user);

        if (isSessionValid) {
            currentUser = session.user;

            // Fetch user data from 'users' table to check account_type
            const { data: userData } = await supabase.from('users').select('account_type').eq('id', session.user.id).single();
            
            // Pass both the auth user and the user data to the functions
            updateUserProfileIcon(session.user, userData);
            await loadUserProfile(session.user);
            
            setupActivityListeners();
        }
        
    } else {
        // No user is signed in, redirect to login.
        window.location.href = 'index.html';
    }
});
