<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizard - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .modal { transition: opacity 0.25s ease; }
        input[type="email"],
        input[type="password"] {
            color: #1f2937; /* Dark gray text for inputs */
        }
        #forgotPasswordLink:hover, a[href="signup.html"]:hover {
            text-decoration: underline;
        }
    </style>

    <link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/images/icons/icon-192x192.png">
<meta name="theme-color" content="#3da0be">
</head>
<body class="flex flex-col min-h-screen">

    <main class="flex-grow flex justify-center items-center p-4" style="background-color: #3da0be;">
        <div class="bg-white p-8 sm:p-12 rounded-2xl shadow-xl max-w-sm w-full">
            <div class="text-center mb-8">
              <img src="images/logo.png" alt="Quizard Logo" class="h-20 mx-auto mb-4" onerror="this.onerror=null;this.src='https://placehold.co/150x80/FFFFFF/3da0be?text=Quizard';">
                <p class="text-gray-600">Please log in to continue</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                           class="mt-1 block w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-purple-500 focus:border-purple-500 sm:text-sm transition duration-150 ease-in-out placeholder-gray-400 focus:outline-none">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" required
                           class="mt-1 block w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-purple-500 focus:border-purple-500 sm:text-sm transition duration-150 ease-in-out placeholder-gray-400 focus:outline-none">
                </div>
                
                <div class="text-right">
                    <a href="#" id="forgotPasswordLink" class="text-sm font-medium" style="color: #3da0be;">Forgot Password?</a>
                </div>

                <button type="submit" id="submitButton"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-lg font-semibold text-white bg-gradient-to-r from-purple-600 to-indigo-700 hover:from-purple-700 hover:to-indigo-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition duration-300 ease-in-out transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-wait">
                    Log In
                </button>
            </form>

            <div class="text-center mt-6">
                <p class="text-sm text-gray-600">
                    Don't have an account?
                    <a href="signup.html" class="font-medium" style="color: #3da0be;">
                        Sign Up
                    </a>
                </p>
            </div>

            <div id="messageBox" class="hidden mt-6 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative" role="alert">
                <strong class="font-bold">Error!</strong>
                <span class="block sm:inline" id="messageText"></span>
            </div>
        </div>

        <div id="forgotPasswordModal" class="modal hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full">
                <h3 class="text-2xl font-bold text-gray-800 mb-4">Reset Password</h3>
                <p class="text-gray-600 mb-6">Enter your email address and we'll send you a link to reset your password.</p>
                <form id="resetPasswordForm">
                    <input type="email" id="resetEmail" placeholder="Your email address" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-purple-500 focus:border-purple-500">
                    <div class="flex justify-end gap-3 mt-6">
                        <button type="button" id="cancelResetBtn" class="py-2 px-6 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold rounded-lg">Cancel</button>
                        <button type="submit" class="py-2 px-6 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg">Send Link</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <footer class="text-center py-6" style="background-color: #3da0be;">
        <div class="container mx-auto px-4">
            <p class="text-white mb-4">Contact Us</p>
            <div class="flex justify-center items-center space-x-6">
                <a href="https://t.me/your_telegram_username" target="_blank" class="text-white hover:opacity-75 transition-opacity" title="Telegram">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.88l-1.44 6.99c-.14.68-.57 1.02-1.25.82l-2.55-.93-1.22 1.17c-.14.14-.25.25-.5.25l.18-2.62 4.52-4.08c.2-.18-.06-.28-.34-.1l-5.58 3.51-2.5-.78c-.67-.21-.67-.67.14-1l11.1-4.24c.57-.22 1.05.14.88.82z"/></svg>
                </a>
                <a href="https://wa.me/your_whatsapp_number" target="_blank" class="text-white hover:opacity-75 transition-opacity" title="WhatsApp">
                    <svg class="w-8 h-8" fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.42 1.29 4.89L2 22l5.05-1.32c1.45.81 3.09 1.29 4.81 1.29h.01c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zM16.5 13.6c-0.2-0.1-1.2-0.6-1.4-0.7c-0.2-0.1-0.3-0.1-0.5 0.1c-0.1 0.2-0.5 0.7-0.6 0.8c-0.1 0.1-0.2 0.2-0.4 0.1c-0.2-0.1-0.9-0.3-1.6-1c-0.6-0.5-1-1.2-1.1-1.4c-0.1-0.2 0-0.3 0.1-0.4c0.1-0.1 0.2-0.3 0.3-0.4c0.1-0.1 0.1-0.2 0.2-0.3c0.1-0.1 0-0.3-0.1-0.4c-0.1-0.1-0.5-1.2-0.6-1.6c-0.2-0.4-0.3-0.4-0.5-0.4h-0.5c-0.2 0-0.4 0.1-0.5 0.3c-0.2 0.2-0.7 0.7-0.7 1.7c0 1 0.7 2 0.8 2.1c0.1 0.1 1.4 2.1 3.3 2.9c0.5 0.2 0.8 0.3 1.1 0.4c0.5 0.1 0.9 0.1 1.2-0.1c0.3-0.2 0.7-0.9 0.8-1.2c0.1-0.3 0.1-0.6 0.1-0.7c-0.01-0.3-0.19-0.4-0.39-0.5z"/></svg>
                </a>
                <a href="mailto:your_email@example.com" class="text-white hover:opacity-75 transition-opacity" title="Email">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                </a>
            </div>
        </div>
    </footer>

    <script type="module">
    // --- Supabase SDK Import ---
import { supabase } from './supabaseClient.js';



    // Add this to both index.html and dashboard.html
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('Service worker registered.', reg))
      .catch(err => console.log('Service worker not registered.', err));
  });
}


// In index.html, at the top of your <script type="module"> tag

// --- Register Service Worker ---
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(registration => {
        console.log('ServiceWorker registration successful on index.html');
      })
      .catch(error => {
        console.log('ServiceWorker registration failed: ', error);
      });
  });
}

// --- Supabase SDK Import ---

    // --- DOM Element References ---
    const loginForm = document.getElementById('loginForm');
    const submitButton = document.getElementById('submitButton');
    const messageBox = document.getElementById('messageBox');
    const messageText = document.getElementById('messageText');
    const forgotPasswordModal = document.getElementById('forgotPasswordModal');
    const resetPasswordForm = document.getElementById('resetPasswordForm');

    // --- UI Functions ---
    function showMessage(message, isError = true) {
        messageText.textContent = message;
        messageBox.className = `mt-6 px-4 py-3 rounded-lg relative ${isError ? 'bg-red-100 border-red-400 text-red-700' : 'bg-green-100 border-green-400 text-green-700'}`;
        messageBox.querySelector('strong').textContent = isError ? 'Error!' : 'Success!';
        messageBox.classList.remove('hidden');
    }

    // --- Supabase Session Management (Replaces Firebase version) ---
// In index.html

async function manageActiveSession(user) {
    // Invoke the new Edge Function to handle session creation.
    const { data, error } = await supabase.functions.invoke('create-active-session');

    if (error) {
        // The Edge Function will provide a specific error message, like "Device limit reached."
        throw new Error(error.message);
    }

    // The Edge Function returns the new session ID, which we save to local storage.
    if (data && data.session_id) {
        localStorage.setItem('sessionId', data.session_id);
    } else {
        // Handle cases where the function might not return a session ID
        throw new Error("Failed to create a valid session.");
    }

    return true;
}

    // --- AUTHENTICATION FLOW ---

    // This listener checks if a user is already logged in when the page loads
    document.addEventListener('DOMContentLoaded', async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            // A user is already logged in, redirect them to the dashboard.
            // The session validation will happen on the dashboard page itself.
            window.location.href = 'dashboard.html';
        } else {
            // No user is signed in, show the login form.
            console.log("No user is signed in. Waiting for login.");
        }
    });

    // This listener handles the manual login form submission
    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        submitButton.textContent = 'Logging In...';
        messageBox.classList.add('hidden');

        const email = loginForm.email.value.trim();
        const password = loginForm.password.value;

        try {
            // 1. Sign in the user with Supabase Auth
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) throw error;
            if (!data.user) throw new Error("Login failed, please try again.");
            
            // 2. After successful login, manage their session device count
            await manageActiveSession(data.user);

            // 3. If everything is successful, redirect to the dashboard
            window.location.href = 'dashboard.html';

        } catch (error) {
            console.error("Login Error:", error);
            let friendlyMessage = error.message || 'An unexpected error occurred.';
            if (friendlyMessage.toLowerCase().includes('invalid login credentials')) {
                friendlyMessage = 'Invalid credentials. Please check your email and password.';
            }
            showMessage(friendlyMessage);
            submitButton.disabled = false;
            submitButton.textContent = 'Log In';
        }
    });

    // --- Forgot Password Logic ---
    document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
        e.preventDefault();
        forgotPasswordModal.classList.remove('hidden');
    });
    document.getElementById('cancelResetBtn').addEventListener('click', () => {
        forgotPasswordModal.classList.add('hidden');
    });
    resetPasswordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('resetEmail').value;
        try {
            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin, // Link will bring user back to your site
            });
            if (error) throw error;
            forgotPasswordModal.classList.add('hidden');
            showMessage('Password reset link sent! Please check your email.', false);
        } catch (error) {
            console.error("Password Reset Error:", error);
            showMessage("Could not send reset link. Please check the email address.");
        }
    });
</script>
</body>
</html>
