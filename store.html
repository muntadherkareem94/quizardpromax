<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="view-transition" content="same-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quizard - Store</title>
    
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="main-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    
    <style>
        .dropdown-item{display:flex;align-items:center;width:100%;padding:0.75rem;border-radius:0.5rem;color:#374151;transition:background-color .2s}
        .dropdown-item:hover{background-color:#f3f4f6}
        .dropdown-item svg,.dropdown-item img{margin-right:0.75rem;width:1.5rem;height:1.5rem;color:#4b5563}
        .video-thumbnail{position:relative;cursor:pointer}
        .video-thumbnail .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:4rem;height:4rem;background-color:rgba(0,0,0,0.5);border-radius:9999px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
        .video-thumbnail:hover .play-icon{opacity:1}
    </style> 
<meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Quizard">
    <link rel="apple-touch-icon" href="images/icons/icon-192x192.png">
</head>
<body class="flex flex-col min-h-screen" style="background-color: #3da0be;">

<div class="container mx-auto max-w-6xl px-4 mt-8">
    <header class="bg-white shadow-md py-2 px-6 flex items-center justify-between z-20 rounded-xl">
        <div class="flex-1">
            <a href="dashboard.html" class="text-gray-600 hover:text-purple-600" title="Back to Dashboard">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            </a>
        </div>
        <div class="flex-shrink-0">
            <a href="dashboard.html"><img src="images/logo.png" alt="Quizard Logo" class="h-16"></a>
        </div>
        <div class="flex-1 flex justify-end items-center space-x-3">
            <button id="notificationButton" class="w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition" title="Notifications">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
            </button>
            <div class="relative">
                <button id="profileDropdownButton" class="w-10 h-10 rounded-full bg-gray-200 flex justify-center items-center overflow-hidden" title="Account"></button>
                <div class="absolute bottom-0 right-0 w-4 h-4 bg-gray-200 rounded-full flex items-center justify-center border-2 border-white pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
                </div>
                <div id="profileDropdownMenu" class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-xl p-2 hidden z-50">
                     <a href="user_profile.html" class="flex items-center p-3 hover:bg-gray-100 rounded-lg">
                        <div id="dropdownProfileImage" class="w-12 h-12 rounded-full bg-gray-200 overflow-hidden mr-4 flex-shrink-0"></div>
                        <div>
                            <p id="dropdownUsername" class="font-semibold text-gray-800 break-all">Loading...</p>
                            <p class="text-sm text-gray-500">View your profile</p>
                        </div>
                    </a>
                    <hr class="my-2">
                    <a href="dashboard.html" class="dropdown-item">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                        <span>Dashboard</span>
                    </a>
                    <a href="performance_analytics.html" class="dropdown-item">
                        <img src="images/performance-analysis.png" alt="Performance Analytics" class="h-6 w-6 mr-3">
                        <span>Performance Analytics</span>
                    </a>
                    <button id="logoutButton" class="dropdown-item w-full text-left">
                         <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                        <span>Log Out</span>
                    </button>
                </div>
            </div>
        </div>
    </header>
</div>

<main class="flex-grow container mx-auto max-w-6xl px-4 py-8 md:py-12">
    <h1 class="text-4xl font-extrabold text-white text-center mb-4">Quizard Store</h1>
    <p class="text-center text-white/80 mb-8">Browse our collection of premium books and video courses.</p>
    
    <div class="bg-white/20 p-4 rounded-xl mb-8 flex flex-col md:flex-row gap-4 items-center">
        <div class="relative flex-grow w-full md:w-auto">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" /></svg>
            </div>
            <input type="search" id="searchInput" class="block w-full pl-10 pr-3 py-3 border-transparent rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-600" placeholder="Search for books or courses...">
        </div>
        <select id="specialtyFilter" class="w-full md:w-72 py-3 px-4 border-transparent rounded-lg bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-purple-600">
            </select>
        <a href="manage_store.html" id="adminUploadBtn" class="hidden w-full md:w-auto bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg text-center">Manage Store</a>
    </div>

    <div id="loadingState" class="text-center text-white py-16 text-xl">Loading Store...</div>
    <div id="storeGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>
</main>

<script type="module">
  import { supabase } from './supabaseClient.js';


    // --- Standard Header & Session Functions ---
    const profileDropdownButton = document.getElementById('profileDropdownButton');
    const profileDropdownMenu = document.getElementById('profileDropdownMenu');

    profileDropdownButton.addEventListener('click', (e) => { e.stopPropagation(); profileDropdownMenu.classList.toggle('hidden'); });
    document.addEventListener('click', () => { if (!profileDropdownMenu.classList.contains('hidden')) profileDropdownMenu.classList.add('hidden'); });

  function updateUserProfileIcon(user, userData) {
    const photoURL = user.user_metadata.photoURL;
    const username = user.user_metadata.username || user.email;

    const profileHTML = photoURL
        ? `<img src="${photoURL}" alt="My Profile" class="w-full h-full object-cover">`
        : `<svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full text-gray-500 p-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>`;

    profileDropdownButton.innerHTML = profileHTML;
    dropdownProfileImage.innerHTML = profileHTML;

    // Conditionally add the premium badge to the dropdown
    let usernameHTML = `<p id="dropdownUsername" class="font-semibold text-gray-800 break-all">${username}</p>`;
    if (userData && userData.account_type === 'premium') {
        usernameHTML = `
            <div class="flex items-center gap-x-2">
                <p id="dropdownUsername" class="font-semibold text-gray-800 break-all">${username}</p>
                <span class="bg-yellow-100 text-yellow-800 text-xs font-semibold px-2 py-0.5 rounded-full flex items-center gap-1">
                    <img src="./images/general/crown.png" alt="Premium" class="w-3 h-3 object-contain">
                    Premium
                </span>
            </div>`;
    }
    
    const usernameContainer = document.getElementById('dropdownUsername').parentNode;
    usernameContainer.innerHTML = usernameHTML + '<p class="text-sm text-gray-500">View your profile</p>';
}
    
    async function handleLogout() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            await supabase.from('active_sessions').delete().eq('user_id', session.user.id);
        }
        await supabase.auth.signOut();
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = 'index.html';
    }

    document.getElementById('logoutButton').addEventListener('click', handleLogout);

    // --- Store Page Specific Code ---
    const dom = {
        loadingState: document.getElementById('loadingState'),
        storeGrid: document.getElementById('storeGrid'),
        searchInput: document.getElementById('searchInput'),
        specialtyFilter: document.getElementById('specialtyFilter'),
        adminUploadBtn: document.getElementById('adminUploadBtn')
    };

    let allStoreItems = [];

    const medicalSpecialties = {
            "Internal Medicine": ["Internal Medicine - General", "Cardiology", "Endocrinology", "Gastroenterology", "Hematology", "Infectious Disease", "Nephrology", "Oncology", "Pulmonology", "Rheumatology"],
            "Surgery": ["General Surgery", "Cardiothoracic Surgery", "Neurosurgery", "Orthopedic Surgery", "Otolaryngology (ENT)", "Pediatric Surgery", "Plastic Surgery", "Urology", "Vascular Surgery"],
            "Pediatrics": ["Pediatrics - General", "Neonatology", "Pediatric Cardiology", "Pediatric Endocrinology", "Pediatric Gastroenterology"],
            "Obstetrics & Gynecology": ["Obstetrics & Gynecology - General", "Gynecologic Oncology", "Maternal-Fetal Medicine", "Reproductive Endocrinology and Infertility"],
            "Other Major Specialties": ["Anesthesiology", "Dermatology", "Emergency Medicine", "Family Medicine", "Neurology", "Ophthalmology", "Pathology", "Psychiatry", "Radiology"],
            "Pharmacy": ["Clinical Pharmacy"]
        };

    function populateSpecialtyFilter() {
        dom.specialtyFilter.innerHTML = '<option value="all">All Specialties</option>';
        for (const group in medicalSpecialties) {
            const optgroup = document.createElement('optgroup');
            optgroup.label = group;
            medicalSpecialties[group].forEach(specialty => {
                const option = document.createElement('option');
                option.value = specialty;
                option.textContent = specialty;
                optgroup.appendChild(option);
            });
            dom.specialtyFilter.appendChild(optgroup);
        }
    }

function handleFilterAndSearch() {
    const searchTerm = dom.searchInput.value.toLowerCase();
    const selectedSpecialty = dom.specialtyFilter.value;

    const filteredItems = allStoreItems.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(searchTerm) || item.description.toLowerCase().includes(searchTerm);

        // --- THIS IS THE CORRECTED LOGIC ---
        const matchesSpecialty = (selectedSpecialty === 'all') ||
                               (item.speciality === selectedSpecialty) ||
                               (item.linked_specialties && item.linked_specialties.includes(selectedSpecialty));

        return matchesSearch && matchesSpecialty;
    });

    // Pass the globally stored currentUserData to the render function
    renderStoreItems(filteredItems, currentUserData);
}
    
async function loadStoreContent(user, userData) {
    // --- 1. 0ms INSTANT CACHE RENDER ---
    const cachedStoreItems = JSON.parse(localStorage.getItem('offline_store_items'));
    if (cachedStoreItems && cachedStoreItems.length > 0) {
        allStoreItems = cachedStoreItems;
        dom.loadingState.classList.add('hidden');
        dom.storeGrid.classList.remove('hidden');
        renderStoreItems(allStoreItems, userData);
    }

    // --- 2. SURGICAL BACKGROUND SYNC ---
    setTimeout(async () => {
        try {
            const [booksRes, coursesRes, bookPurchasesRes, videoPurchasesRes] = await Promise.all([
                supabase.from('books').select('*').in('access_level', ['premium', 'purchasable', 'free']),
                supabase.from('video_courses').select('*').in('access_level', ['premium', 'purchasable', 'free']),
                supabase.from('user_purchases').select('book_id').eq('user_id', user.id).or('expires_at.is.null,expires_at.gt.now()'),
                supabase.from('user_video_purchases').select('course_id').eq('user_id', user.id).or('expires_at.is.null,expires_at.gt.now()')
            ]);

            if (booksRes.error) throw booksRes.error;
            if (coursesRes.error) throw coursesRes.error;

            const allBooks = booksRes.data.map(item => ({ ...item, type: 'book' }));
            const allCourses = coursesRes.data.map(item => ({ ...item, type: 'video_course' }));
            const allItems = [...allBooks, ...allCourses];

            const purchasedBookIds = new Set((bookPurchasesRes.data || []).map(p => p.book_id));
            const purchasedCourseIds = new Set((videoPurchasesRes.data || []).map(p => p.course_id));

           const itemsToDisplay = allItems.filter(item => {
                const userSpecialty = userData.speciality.trim();
                const matchesPrimarySpecialty = item.speciality ? item.speciality.trim() === userSpecialty : false;
                const matchesLinkedSpecialty = item.linked_specialties && item.linked_specialties.includes(userSpecialty);
                const userHasSpecialtyAccess = matchesPrimarySpecialty || matchesLinkedSpecialty;

                const isOwned = item.type === 'book' ? purchasedBookIds.has(item.id) : purchasedCourseIds.has(item.id);
                if (isOwned) return false;

                const isPremiumUserWithAccess = userData.account_type === 'premium' && item.access_level === 'premium' && userHasSpecialtyAccess;
                if (isPremiumUserWithAccess) return false;

                const isFreeContentInSpecialty = item.access_level === 'free' && userHasSpecialtyAccess;
                if (isFreeContentInSpecialty) return false;

                return true;
            });

            allStoreItems = itemsToDisplay;
            
            // Save to memory for instant loading next time
            localStorage.setItem('offline_store_items', JSON.stringify(allStoreItems));

            dom.loadingState.classList.add('hidden');
            dom.storeGrid.classList.remove('hidden');
            
            // Repaint with fresh data silently
            renderStoreItems(allStoreItems, userData);

        } catch (error) {
            console.error("Error loading store content:", error);
            if (!cachedStoreItems) dom.loadingState.textContent = 'Could not load store items. Check console for details.';
        }
    }, 100); // Tiny delay to ensure browser paints transition first
}
// In store.html

function renderStoreItems(itemsToRender, userData) {
    dom.storeGrid.innerHTML = '';
    if (itemsToRender.length === 0) {
        dom.storeGrid.innerHTML = '<p class="text-white text-center col-span-full py-16">No items available for purchase at this time.</p>';
        return;
    }

    itemsToRender.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow-lg overflow-hidden flex flex-col';
        
        let buttonHTML = '';
        let badgeHTML = '';

        // FIX: Differentiate rendering based on access level
        if (item.access_level === 'free') {
            badgeHTML = `<span class="absolute top-2 right-2 bg-blue-500 text-white text-xs font-bold px-2 py-1 rounded-full">Free</span>`;
            buttonHTML = `<button data-item-id="${item.id}" data-item-type="${item.type}" class="add-free-item-btn w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 text-center">Add to Dashboard</button>`;
        } else {
            buttonHTML = `<button class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 text-center">Purchase</button>`;
            if (item.access_level === 'premium') {
                badgeHTML = `<span class="absolute top-2 right-2 bg-yellow-500 text-white text-xs font-bold px-2 py-1 rounded-full flex items-center gap-1"><img src="./images/general/crown.png" class="w-3 h-3">Premium</span>`;
            }
        }
        
        if (item.type === 'video_course') {
            badgeHTML += `<span class="absolute top-2 left-2 bg-indigo-500 text-white text-xs font-bold px-2 py-1 rounded-full">Video Course</span>`;
        } else {
            badgeHTML += `<span class="absolute top-2 left-2 bg-purple-500 text-white text-xs font-bold px-2 py-1 rounded-full">Book</span>`;
        }

        card.innerHTML = `
            <div class="p-6 flex flex-col flex-grow">
                <div class="relative h-48 overflow-hidden bg-gray-200 flex items-center justify-center mb-4 rounded-lg">
                    <img src="${item.image || item.thumbnail_url}" alt="${item.title}" class="w-full h-full object-contain">
                    ${badgeHTML}
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">${item.title}</h3>
                <p class="text-gray-600 text-sm flex-grow">${item.description}</p>
            </div>
            ${buttonHTML}
        `;
        dom.storeGrid.appendChild(card);
    });
}


let currentUserData = null;

document.addEventListener('DOMContentLoaded', () => {
    // 1. NON-BLOCKING CACHE RENDER 
    const cachedStoreItems = JSON.parse(localStorage.getItem('offline_store_items'));
    const cachedUserData = JSON.parse(localStorage.getItem('offline_userData'));
    
    if (cachedStoreItems && cachedStoreItems.length > 0) {
        allStoreItems = cachedStoreItems;
        
        // Hide loader instantly, but postpone drawing cards
        dom.loadingState.classList.add('hidden');
        dom.storeGrid.classList.remove('hidden');
        
        // Tiny delay yields the main thread back to the mobile GPU
        setTimeout(() => {
            renderStoreItems(allStoreItems, cachedUserData || { account_type: 'free', speciality: '' });
        }, 1); 
    }

    // 2. YIELD TO THE BROWSER'S ANIMATION ENGINE
    requestAnimationFrame(async () => {
        try {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                populateSpecialtyFilter();
                
                // Fetch role, account_type, AND speciality
                const { data: userDataResponse } = await supabase.from('users').select('role, account_type, speciality').eq('id', session.user.id).single();
                currentUserData = userDataResponse; 
                localStorage.setItem('offline_userData', JSON.stringify(currentUserData)); // Update cache
                
                updateUserProfileIcon(session.user, currentUserData);

                if (currentUserData && currentUserData.role === 'admin') {
                    dom.adminUploadBtn.classList.remove('hidden');
                }

                await loadStoreContent(session.user, currentUserData);

                dom.searchInput.addEventListener('input', handleFilterAndSearch);
                dom.specialtyFilter.addEventListener('change', handleFilterAndSearch);
            } else {
                window.location.href = 'index.html';
            }
        } catch (error) {
            console.error("Auth error:", error);
        }
    });
});

async function handleAddFreeItem(itemId, itemType, buttonElement) {
    buttonElement.disabled = true;
    buttonElement.textContent = 'Adding...';

    try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error("User not authenticated.");

        const tableName = itemType === 'book' ? 'user_purchases' : 'user_video_purchases';
        const columnMapping = itemType === 'book' 
            ? { user_id: session.user.id, book_id: itemId }
            : { user_id: session.user.id, course_id: itemId };

        const { error } = await supabase.from(tableName).insert([columnMapping]);
        if (error) throw error;

        alert('Successfully added to your dashboard!');
        const card = buttonElement.closest('.bg-white');
        if (card) card.remove();
        allStoreItems = allStoreItems.filter(item => item.id !== itemId);

    } catch (error) {
        console.error('Error adding free item:', error);
        alert(`Failed to add item: ${error.message}`);
        buttonElement.disabled = false;
        buttonElement.textContent = 'Add to Dashboard';
    }
}

dom.storeGrid.addEventListener('click', (e) => {
    const button = e.target.closest('.add-free-item-btn');
    if (button) {
        const { itemId, itemType } = button.dataset;
        handleAddFreeItem(itemId, itemType, button);
    }
});
</script>

</body>
</html>
