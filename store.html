    <style>
        .dropdown-item{display:flex;align-items:center;width:100%;padding:0.75rem;border-radius:0.5rem;color:#374151;transition:background-color .2s}
        .dropdown-item:hover{background-color:#f3f4f6}
        .dropdown-item svg,.dropdown-item img{margin-right:0.75rem;width:1.5rem;height:1.5rem;color:#4b5563}
        .video-thumbnail{position:relative;cursor:pointer}
        .video-thumbnail .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:4rem;height:4rem;background-color:rgba(0,0,0,0.5);border-radius:9999px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
        .video-thumbnail:hover .play-icon{opacity:1}

        /* Quizard Store — clean product cards */
        .qz-store-card {
            border: 1px solid #e0eaf1;
            transition: transform .2s ease,
                        box-shadow .2s ease,
                        border-color .2s ease;
        }

        .qz-store-card:hover {
            transform: translateY(-3px);
            border-color: #b8d9e8;
            box-shadow: 0 12px 30px rgba(17, 58, 82, .13);
        }

        /* A single badge identifying the content type */
        .qz-store-type-badge {
            position: absolute;
            top: 11px;
            left: 11px;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 11px;
            border-radius: 9px;
            background: rgba(255, 255, 255, .96);
            border: 1px solid rgba(205, 219, 232, .95);
            box-shadow: 0 3px 12px rgba(16, 42, 62, .10);
            backdrop-filter: blur(8px);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .15px;
            line-height: 1;
            white-space: nowrap;
        }

        .qz-store-type-badge svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .qz-store-type-book {
            color: #315b90;
        }

        .qz-store-type-video {
            color: #087f72;
        }

        /* Store purchase section */
        .qz-store-purchase-area {
            margin-top: auto;
            padding: 7px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .qz-store-price-hint {
            text-align: center;
            font-size: 12px;
            color: #64748b;
            margin: 0;
        }

        .qz-store-price-hint strong {
            color: #17354a;
            font-size: 14px;
            font-weight: 800;
        }

        .qz-store-buy-button {
            display: block;
            width: 100%;
            min-height: 45px;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            background: #178eae;
            color: white;
            font-size: 13px;
            font-weight: 800;
            line-height: 1.4;
            cursor: pointer;
            transition: background .2s ease,
                        box-shadow .2s ease;
        }

        .qz-store-buy-button:hover {
            background: #116e8b;
            box-shadow: 0 5px 15px rgba(23, 142, 174, .2);
        }

        .qz-store-buy-button:focus-visible {
            outline: 3px solid #8dd9ee;
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            .qz-store-type-badge {
                top: 8px;
                left: 8px;
                padding: 7px 9px;
                font-size: 10px;
            }
        }
    </style>

    async function handleLogout() {
        const sessionId = localStorage.getItem('sessionId');

        try {
            if (sessionId) {
                await supabase
                    .from('active_sessions')
                    .delete()
                    .eq('session_id', sessionId);
            }
        } catch (error) {
            console.warn('Active session cleanup failed, continuing logout:', error);
        }

        // Remove only the active session id.
        // Do NOT use localStorage.clear(), because it deletes quizardDeviceId.
        localStorage.removeItem('sessionId');

        // Optional old Firebase key cleanup, safe to keep:
        localStorage.removeItem('userSessionId');

        sessionStorage.clear();

        try {
            await supabase.auth.signOut({ scope: 'local' });
        } catch (error) {
            console.warn('Supabase local sign-out failed:', error);
        }

        window.location.href = 'index.html';
    }

        document.getElementById('logoutButton').addEventListener('click', async () => {
        await handleLogout();
    });

            "Pediatrics": ["Pediatrics - General", "Neonatology", "Pediatric Cardiology", "Pediatric Endocrinology", "Pediatric Gastroenterology"],
            "Obstetrics & Gynecology": ["Obstetrics & Gynecology - General", "Gynecologic Oncology", "Maternal-Fetal Medicine", "Reproductive Endocrinology and Infertility"],
            "Other Major Specialties": ["anesthesiology and Intensive Care", "Dermatology", "Emergency Medicine", "Family Medicine", "Neurology", "Ophthalmology", "Pathology", "Psychiatry", "Radiology"],
            "Pharmacy": ["Clinical Pharmacy"]

    function populateSpecialtyFilter() {
        dom.specialtyFilter.innerHTML = '<option value="all">All Specialties</option>';
        for (const group in medicalSpecialties) {

                option.value = specialty;

                               (item.speciality === selectedSpecialty) ||

    });

}
    
async function loadStoreContent(user, userData) {
    // --- 1. 0ms INSTANT CACHE RENDER ---
    const cachedStoreItems = JSON.parse(localStorage.getItem('offline_store_items'));
    if (cachedStoreItems && cachedStoreItems.length > 0) {
        allStoreItems = cachedStoreItems;
        dom.loadingState.classList.add('hidden');
        dom.storeGrid.classList.remove('hidden');
        renderStoreItems(allStoreItems, userData);
    }

    // --- 2. SURGICAL BACKGROUND SYNC ---
    setTimeout(async () => {
        try {
           
const [
    booksRes, coursesRes, accessRes, rulesRes,
    videoPurchasesRes
] = await Promise.all([
   
supabase.from('books').select('*').in('access_level', ['premium', 'platinum', 'purchasable', 'free']),

    supabase.from('video_courses').select('*').in('access_level', ['premium', 'purchasable', 'free']),
    supabase.rpc('qz_my_book_access'),
    


supabase.from('qz_book_rules').select(
    'book_id,access_mode,standalone_enabled,' +
    'standalone_price_iqd,standalone_price_6m_iqd,' +
    'standalone_price_12m_iqd'
),


    supabase.from('user_video_purchases').select('course_id').eq('user_id', user.id).or('expires_at.is.null,expires_at.gt.now()')
]);

for (const result of [
    booksRes, coursesRes, accessRes, rulesRes, videoPurchasesRes
]) {
    if (result.error) throw result.error;
}

const bookAccessMap = new Map(
    (accessRes.data || []).map(row => [
        String(row.book_id), row
    ])
);

const bookRulesMap = new Map(
    (rulesRes.data || []).map(row => [
        String(row.book_id), row
    ])
);

const allBooks = (booksRes.data || []).map(item => {
    const rule = bookRulesMap.get(String(item.id));
    const configuredTier =
        rule?.access_mode || item.access_level;

    return {
        ...item,
        type: 'book',
        access_level: configuredTier === 'standalone'
            ? 'purchasable'
            : configuredTier,
      

standalone_enabled:
    rule?.standalone_enabled === true,
standalone_price_iqd:
    rule?.standalone_price_iqd ?? null,
standalone_price_6m_iqd:
    rule?.standalone_price_6m_iqd ?? null,
standalone_price_12m_iqd:
    rule?.standalone_price_12m_iqd ?? null


    };
});

const allCourses = (coursesRes.data || []).map(item => ({
    ...item,
    type: 'video_course'
}));

const allItems = [...allBooks, ...allCourses];

const purchasedCourseIds = new Set(
    (videoPurchasesRes.data || []).map(p =>
        String(p.course_id)
    )
);


           const itemsToDisplay = allItems.filter(item => {
                const userSpecialty = userData.speciality.trim();
                const matchesPrimarySpecialty = item.speciality ? item.speciality.trim() === userSpecialty : false;
                const matchesLinkedSpecialty = item.linked_specialties && item.linked_specialties.includes(userSpecialty);
                const userHasSpecialtyAccess = matchesPrimarySpecialty || matchesLinkedSpecialty;

               
if (item.type === 'book') {
    // Use current Supabase entitlements for book ownership.
    if (
        item.access_level !== 'free' &&
        bookAccessMap.get(String(item.id))?.has_access === true

    }
} else {
    // Preserve the existing video-course access system.
    if (purchasedCourseIds.has(String(item.id))) {

    }

    if (
        userData.account_type === 'premium' &&
        item.access_level === 'premium' &&

    ) {

    }
}


                const isFreeContentInSpecialty = item.access_level === 'free' && userHasSpecialtyAccess;
                if (isFreeContentInSpecialty) return false;

                return true;
            });

            allStoreItems = itemsToDisplay;
            
            // Save to memory for instant loading next time
            localStorage.setItem('offline_store_items', JSON.stringify(allStoreItems));

            dom.loadingState.classList.add('hidden');

            if (!cachedStoreItems) dom.loadingState.textContent = 'Could not load store items. Check console for details.';

    }, 100); // Tiny delay to ensure browser paints transition first
}
// In store.html

function renderStoreItems(itemsToRender, userData) {
    dom.storeGrid.innerHTML = '';
    if (itemsToRender.length === 0) {
        dom.storeGrid.innerHTML = '<p class="text-white text-center col-span-full py-16">No items available for purchase at this time.</p>';
        return;
    }

    itemsToRender.forEach(item => {

        const card = document.createElement('div');
        card.className = 'qz-store-card bg-white rounded-xl shadow-lg overflow-hidden flex flex-col';

        
        let buttonHTML = '';
        let badgeHTML = '';


        // Store actions — one purchase button per book.
        if (item.access_level === 'free') {
            buttonHTML = `
                <div class="qz-store-purchase-area">
                    <button
                        type="button"
                        data-item-id="${item.id}"
                        data-item-type="${item.type}"
                        class="add-free-item-btn qz-store-buy-button">
                        Add to Dashboard
                    </button>
                </div>
            `;

        } else if (item.type === 'book') {

            // Current individual-book pricing:
            // 3, 6 and 12 months.
            const individualOffers = [
                {
                    months: 3,
                    price: Number(item.standalone_price_iqd)
                },
                {
                    months: 6,
                    price: Number(item.standalone_price_6m_iqd)
                },
                {
                    months: 12,
                    price: Number(item.standalone_price_12m_iqd)
                }
            ].filter(offer =>
                Number.isSafeInteger(offer.price) &&
                offer.price > 0
            );

            const canBuyAlone =
                item.standalone_enabled === true &&
                individualOffers.length > 0;

            const isInPlan =
                ['premium', 'platinum'].includes(
                    item.access_level
                );

            if (canBuyAlone || isInPlan) {
                const lowestPrice = canBuyAlone
                    ? Math.min(
                        ...individualOffers.map(offer => offer.price)
                    )
                    : null;

                const priceHint = lowestPrice !== null
                    ? `
                        <p class="qz-store-price-hint">
                            From
                            <strong>
                                ${lowestPrice.toLocaleString('en-IQ')} IQD
                            </strong>
                        </p>
                    `
                    : '';

                buttonHTML = `
                    <div class="qz-store-purchase-area">
                        ${priceHint}

                        <button
                            type="button"
                            data-qz-plan-book="${item.id}"
                            class="qz-store-buy-button">
                            Buy This Book
                        </button>
                    </div>
                `;
            } else {
                buttonHTML = `
                    <div class="qz-store-purchase-area">
                        <button type="button" disabled
                            class="w-full bg-gray-400 text-white
                                   font-semibold py-3 px-4
                                   rounded-lg cursor-not-allowed">
                            Not Currently for Sale
                        </button>
                    </div>
                `;
            }

        } else {
            // Keep existing video-course restrictions.
            // The book checkout must not be used for videos.
            buttonHTML = `
                <div class="qz-store-purchase-area">
                    <button type="button" disabled
                        class="w-full bg-gray-400 text-white
                               font-semibold py-3 px-4
                               rounded-lg cursor-not-allowed">
                        Video Checkout Unavailable
                    </button>
                </div>
            `;
        }

        // One elegant content-type badge.
        // No Standalone, Premium or Platinum labels.
        if (item.type === 'video_course') {
            badgeHTML = `
                <span class="qz-store-type-badge qz-store-type-video">
                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">
                        <rect x="3" y="4" width="18"
                              height="16" rx="3"/>
                        <path d="m10 8 6 4-6 4z"/>
                    </svg>
                    <span>Video Course</span>
                </span>
            `;
        } else {
            badgeHTML = `
                <span class="qz-store-type-badge qz-store-type-book">
                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">
                        <path d="M12 6c-3-2-6-2-9-1v14
                                 c3-1 6-1 9 1"/>
                        <path d="M12 6c3-2 6-2 9-1v14
                                 c-3-1-6-1-9 1"/>
                        <path d="M12 6v14"/>
                    </svg>
                    <span>Book</span>
                </span>
            `;
        }


        card.innerHTML = `
            <div class="p-6 flex flex-col flex-grow">
                <div class="relative h-48 overflow-hidden bg-gray-200 flex items-center justify-center mb-4 rounded-lg">
                    <img src="${item.image || item.thumbnail_url}" alt="${item.title}" class="w-full h-full object-contain">
                    ${badgeHTML}
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">${item.title}</h3>
                <p class="text-gray-600 text-sm flex-grow">${item.description}</p>
            </div>
            ${buttonHTML}
        `;
        dom.storeGrid.appendChild(card);
    });
}


let currentUserData = null;

// --- Inactivity Logout ---
const INACTIVITY_TIMEOUT = 30 * 60 * 1000; // 30 minutes
let inactivityTimer;

function resetInactivityTimer() {
    if (inactivityTimer) clearTimeout(inactivityTimer);

    inactivityTimer = setTimeout(async () => {
        console.warn("User logged out due to inactivity.");
        await handleLogout();
    }, INACTIVITY_TIMEOUT);
}

function setupActivityListeners() {
    ['mousemove', 'mousedown', 'keypress', 'scroll', 'touchstart'].forEach(event => {
        document.addEventListener(event, resetInactivityTimer, true);
    });

    resetInactivityTimer();
}

async function validateAndEnforceSession(user) {
    const sessionId = localStorage.getItem('sessionId');

    if (!sessionId) {
        console.warn("No sessionId found → logout");
        await handleLogout();
        return false;
    }

    const { data, error } = await supabase
        .from('active_sessions')
        .select('expires_at')
        .eq('user_id', user.id)
        .eq('session_id', sessionId)
        .maybeSingle();

    if (error) {
        console.warn("Temporary session check error → IGNORE", error.message);
        return true;
    }

    if (!data) {
        console.warn("Session row missing → logout");
        await handleLogout();
        return false;
    }

    if (new Date() > new Date(data.expires_at)) {
        console.warn("Session expired → logout");
        await handleLogout();
        return false;
    }

        return true;
}

function getOrCreateDeviceId() {
    let deviceId = localStorage.getItem('quizardDeviceId');

    if (!deviceId) {
        deviceId = crypto.randomUUID();
        localStorage.setItem('quizardDeviceId', deviceId);
    }

    return deviceId;
}

async function refreshActiveSession() {
    const sessionId = localStorage.getItem('sessionId');

    if (!sessionId) {
        return;
    }

    try {
        const { error } = await supabase.functions.invoke('create-active-session', {
            body: {
                device_id: getOrCreateDeviceId(),
                existing_session_id: sessionId
            }
        });

        if (error) {
            console.warn('Active session refresh failed:', error.message);
        }
    } catch (error) {
        console.warn('Active session refresh exception:', error);
    }
}

function startActiveSessionHeartbeat() {
    refreshActiveSession();

    setInterval(refreshActiveSession, 5 * 60 * 1000);

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            refreshActiveSession();
        }
    });
}

document.addEventListener('DOMContentLoaded', () => {
    // 1. NON-BLOCKING CACHE RENDER 
    const cachedStoreItems = JSON.parse(localStorage.getItem('offline_store_items'));
    const cachedUserData = JSON.parse(localStorage.getItem('offline_userData'));
    
    if (cachedStoreItems && cachedStoreItems.length > 0) {
        allStoreItems = cachedStoreItems;
        
        // Hide loader instantly, but postpone drawing cards
        dom.loadingState.classList.add('hidden');
        dom.storeGrid.classList.remove('hidden');
        
        // Tiny delay yields the main thread back to the mobile GPU
        setTimeout(() => {
            renderStoreItems(allStoreItems, cachedUserData || { account_type: 'free', speciality: '' });
        }, 1); 
    }

    // 2. YIELD TO THE BROWSER'S ANIMATION ENGINE
    requestAnimationFrame(async () => {
        try {
            const { data: { session } } = await supabase.auth.getSession();
                       if (session) {
                const isSessionValid = await validateAndEnforceSession(session.user);

                if (!isSessionValid) {
                    return;
                }

                populateSpecialtyFilter();
                
                // Fetch role, account_type, AND speciality
                const { data: userDataResponse } = await supabase
                    .from('users')
                    .select('role, account_type, speciality')
                    .eq('id', session.user.id)
                    .single();

                currentUserData = userDataResponse; 
                localStorage.setItem('offline_userData', JSON.stringify(currentUserData));
                
                updateUserProfileIcon(session.user, currentUserData);

                if (currentUserData && currentUserData.role === 'admin') {
                    dom.adminUploadBtn.classList.remove('hidden');
                }

                await loadStoreContent(session.user, currentUserData);

                dom.searchInput.addEventListener('input', handleFilterAndSearch);
                dom.specialtyFilter.addEventListener('change', handleFilterAndSearch);

                                // Start inactivity logout timer
                setupActivityListeners();

                // Refresh active_sessions expires_at while the user is active on this page
                startActiveSessionHeartbeat();

                // SESSION VALIDATION CHECKER
                setInterval(async () => {
                    await validateAndEnforceSession(session.user);
                }, 30000);
            } else {
                window.location.href = 'index.html';
            }
        } catch (error) {
            console.error("Auth error:", error);
        }
    });
});

async function handleAddFreeItem(itemId, itemType, buttonElement) {
    buttonElement.disabled = true;
    buttonElement.textContent = 'Adding...';

    try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error("User not authenticated.");

        const tableName = itemType === 'book' ? 'user_purchases' : 'user_video_purchases';
        const columnMapping = itemType === 'book' 
            ? { user_id: session.user.id, book_id: itemId }
            : { user_id: session.user.id, course_id: itemId };

        const { error } = await supabase.from(tableName).insert([columnMapping]);
        if (error) throw error;

        alert('Successfully added to your dashboard!');
        const card = buttonElement.closest('.bg-white');
        if (card) card.remove();
        allStoreItems = allStoreItems.filter(item => item.id !== itemId);

    } catch (error) {
        console.error('Error adding free item:', error);
        alert(`Failed to add item: ${error.message}`);
        buttonElement.disabled = false;
        buttonElement.textContent = 'Add to Dashboard';
    }
}

dom.storeGrid.addEventListener('click', (e) => {
    const button = e.target.closest('.add-free-item-btn');
    if (button) {
        const { itemId, itemType } = button.dataset;
        handleAddFreeItem(itemId, itemType, button);
    }
});
