<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="view-transition" content="same-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quizard - Manage Questions</title>
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="main-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal { transition: opacity 0.25s ease; }
        textarea { resize: vertical; }
    </style>
<meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Quizard">
    <link rel="apple-touch-icon" href="images/icons/icon-192x192.png">
</head>
<body class="bg-gray-100">
    <header class="bg-white shadow-md py-4 px-6 md:px-10 flex justify-between items-center z-10 sticky top-0">
        <div class="flex items-center">
            <svg class="w-8 h-8 text-purple-600 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8zm-.75-10.25a.75.75 0 011.5 0v3.5a.75.75 0 01-1.5 0v-3.5zm.75-2.25c.414 0 .75.336.75.75s-.336.75-.75-.75-.75-.336-.75-.75.336-.75.75-.75z"/></svg>
            <h1 class="text-2xl font-bold text-gray-800">Question Management</h1>
        </div>
        <div class="flex items-center space-x-4">
            <a id="backToChaptersButton" href="#" class="text-gray-600 hover:text-purple-600 font-medium transition duration-200">Back to Chapters</a>
            <button id="logoutButton" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow transition duration-300">Logout</button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 md:py-12">
        <div class="flex justify-between items-center mb-8 gap-4">
            <h2 id="chapterTitle" class="text-3xl font-extrabold text-gray-800">Loading...</h2>
            <div class="flex gap-2">
                <button id="bulkImportButton" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition duration-300">Bulk Import</button>
                <button id="addQuestionButton" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition duration-300">Add New Question</button>
            </div>
        </div>
        <div id="questionList" class="space-y-6">
            <div id="loadingState" class="text-center text-gray-500 py-10">Loading questions...</div>
        </div>
    </main>

    <div id="questionModal" class="modal fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 hidden opacity-0 overflow-y-auto">
        <div class="bg-white rounded-lg shadow-2xl p-8 max-w-2xl w-full my-8 transform transition-transform duration-300 scale-95">
            <h3 id="modalTitle" class="text-2xl font-bold text-gray-800 mb-6">Add New Question</h3>
            <form id="questionForm" class="space-y-4">
                <input type="hidden" id="questionId">
                <div>
                    <label for="questionNumber" class="block text-sm font-medium text-gray-700">Question Number</label>
                    <input type="number" id="questionNumber" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500">
                </div>
                <div>
                    <label for="questionText" class="block text-sm font-medium text-gray-700">Question</label>
                    <textarea id="questionText" rows="4" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500"></textarea>
                </div>
               <div>
    <label class="block text-sm font-medium text-gray-700">Question Images</label>
    <div class="mt-1 space-y-2">
        <input type="file" id="questionImageUpload" accept="image/*" multiple class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
        <textarea id="questionImageUrl" rows="3" placeholder="Paste one or multiple image URLs here. Put each URL on a new line." class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500"></textarea>
    </div>
</div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="optionA" class="block text-sm font-medium text-gray-700">Option A</label>
                        <input type="text" id="optionA" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                    </div>
                     <div>
                        <label for="optionB" class="block text-sm font-medium text-gray-700">Option B</label>
                        <input type="text" id="optionB" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                    </div>
                     <div>
                        <label for="optionC" class="block text-sm font-medium text-gray-700">Option C</label>
                        <input type="text" id="optionC" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                    </div>
                     <div>
                        <label for="optionD" class="block text-sm font-medium text-gray-700">Option D</label>
                        <input type="text" id="optionD" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                    </div>
                     <div>
                        <label for="optionE" class="block text-sm font-medium text-gray-700">Option E (Optional)</label>
                        <input type="text" id="optionE" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                    </div>
                </div>
                 <div>
                    <label for="correctAnswer" class="block text-sm font-medium text-gray-700">Correct Answer</label>
                    <select id="correctAnswer" required class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500">
                        <option value="0">Option A</option>
                        <option value="1">Option B</option>
                        <option value="2">Option C</option>
                        <option value="3">Option D</option>
                        <option value="4">Option E</option>
                    </select>
                </div>
                <div>
                    <label for="explanation" class="block text-sm font-medium text-gray-700">Explanation</label>
                    <textarea id="explanation" rows="4" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500"></textarea>
                </div>
               <div>
    <label class="block text-sm font-medium text-gray-700">Explanation Images</label>
    <div class="mt-1 space-y-2">
        <input type="file" id="explanationImageUpload" accept="image/*" multiple class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
        <textarea id="explanationImageUrl" rows="3" placeholder="Paste one or multiple image URLs here. Put each URL on a new line." class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500"></textarea>
    </div>
</div>
                <div class="flex justify-end pt-4">
                    <button type="button" id="cancelButton" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg mr-3">Cancel</button>
                    <button type="submit" id="saveButton" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded-lg">Save Question</button>
                </div>
            </form>
        </div>
    </div>

    <div id="importModal" class="modal fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 hidden opacity-0">
        <div class="bg-white rounded-lg shadow-2xl p-8 max-w-2xl w-full transform transition-transform duration-300 scale-95">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">Bulk Import Questions</h3>
            <p class="text-sm text-gray-600 mb-4">Paste the contents of your JSON file below. The JSON should be an object with a "questions" array.</p>
            <form id="importForm">
                <textarea id="jsonInput" rows="10" class="w-full p-2 border border-gray-300 rounded-md font-mono text-sm" placeholder='{ "questions": [ ... ] }'></textarea>
                <div class="flex justify-end pt-4">
                    <button type="button" id="cancelImportButton" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg mr-3">Cancel</button>
                    <button type="submit" id="importButton" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg">Import Questions</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="messageBox" class="hidden fixed bottom-5 right-5 mt-6 px-4 py-3 rounded-lg shadow-lg" role="alert">
        <p id="messageText"></p>
    </div>

    <script type="module">
import { supabase } from './supabaseClient.js';


        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('bookId');
        const chapterId = urlParams.get('chapterId');
        
        const chapterTitleEl = document.getElementById('chapterTitle');
        const questionListEl = document.getElementById('questionList');
        const loadingStateEl = document.getElementById('loadingState');
        const addQuestionButton = document.getElementById('addQuestionButton');
        const questionModal = document.getElementById('questionModal');
        const questionForm = document.getElementById('questionForm');
        const modalTitle = document.getElementById('modalTitle');
        const cancelButton = document.getElementById('cancelButton');
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');
        const logoutButton = document.getElementById('logoutButton');
        const backToChaptersButton = document.getElementById('backToChaptersButton');
        const bulkImportButton = document.getElementById('bulkImportButton');
        const importModal = document.getElementById('importModal');
        const cancelImportButton = document.getElementById('cancelImportButton');
        const importForm = document.getElementById('importForm');
        const jsonInput = document.getElementById('jsonInput');

        backToChaptersButton.href = `manage_chapters.html?bookId=${bookId}`;

        function showMessage(message, isError = false) {
            messageText.textContent = message;
            messageBox.className = `fixed bottom-5 right-5 mt-6 px-4 py-3 rounded-lg shadow-lg ${isError ? 'bg-red-100 border-red-400 text-red-700' : 'bg-green-100 border-green-400 text-green-700'}`;
            messageBox.classList.remove('hidden');
            setTimeout(() => messageBox.classList.add('hidden'), 6000);
        }

        function openModal(modal) {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
            }, 10);
        }

        function closeModal(modal) {
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                if (modal === questionModal) {
                    questionForm.reset();
                    document.getElementById('questionId').value = '';
                    document.getElementById('questionImageUpload').value = '';
                    document.getElementById('explanationImageUpload').value = '';
                }
                if (modal === importModal) {
                    importForm.reset();
                }
            }, 300);
        }

        // --- UPLOAD HELPER ---
        async function uploadToStorage(file, chapterId, typePrefix) {
            const fileExt = file.name.split('.').pop();
            const safeName = file.name.replace(/[^a-zA-Z0-9.\-]/g, '');
            const filePath = `chapter_${chapterId}/${typePrefix}_${Date.now()}_${safeName}`;

            const { error } = await supabase.storage.from('question_images').upload(filePath, file, { upsert: true });
            if (error) throw error;

            const { data } = supabase.storage.from('question_images').getPublicUrl(filePath);
            return data.publicUrl;
        }


function parseImageUrlsFromTextarea(value) {
    return (value || '')
        .split(/\n|,/)
        .map(url => url.trim())
        .filter(Boolean);
}

async function uploadMultipleImages(fileList, chapterId, typePrefix) {
    const files = Array.from(fileList || []);
    const uploadedUrls = [];

    for (const file of files) {
        const uploadedUrl = await uploadToStorage(file, chapterId, typePrefix);
        uploadedUrls.push(uploadedUrl);
    }

    return uploadedUrls;
}

        async function loadQuestions() {
            if (!bookId || !chapterId) {
                showMessage("Book ID or Chapter ID is missing.", true);
                return;
            }
            try {
                const { data: chapterData, error: chapterError } = await supabase.from('chapters').select('chapterNumber, name').eq('id', chapterId).single();
                if (chapterError) throw chapterError;
                chapterTitleEl.textContent = `Questions for: Ch. ${chapterData.chapterNumber} - ${chapterData.name}`;

                const { data: questions, error: questionsError } = await supabase.from('questions').select('*').eq('chapter_id', chapterId).order('questionNumber', { ascending: true });
                if (questionsError) throw questionsError;

                loadingStateEl.classList.add('hidden');
                questionListEl.innerHTML = '';
                if (questions.length === 0) {
                    questionListEl.innerHTML = `<div class="text-center text-gray-500 py-10">No questions found.</div>`;
                    return;
                }
          questions.forEach(q => {
                    const questionImages = q.imageUrls || (q.imageUrl ? [q.imageUrl] : []);
                    const explanationImages = q.explanationImageUrls || (q.explanationImageUrl ? [q.explanationImageUrl] : []);

                    const questionCard = `
                        <div class="bg-white p-6 rounded-lg shadow" data-id="${q.id}">
                            <p class="font-semibold text-gray-800">Q${q.questionNumber}: ${q.question}</p>
                            
                            <div class="my-4 space-y-2">
                                ${questionImages.map(url => `
                                    <img src="${url}" class="rounded-lg max-h-48 border" onerror="this.style.display='none'">
                                `).join('')}
                            </div>
                            <div class="mt-4 space-y-2 text-sm">
                                ${q.options.map((opt, i) => `<p class="${i === q.correctAnswerIndex ? 'text-green-600 font-bold' : 'text-gray-600'}"><strong>${String.fromCharCode(65+i)}:</strong> ${opt}</p>`).join('')}
                            </div>
                            <div class="mt-4 pt-4 border-t border-gray-200">
                                <p class="text-sm text-gray-800"><strong class="font-semibold">Explanation:</strong> ${q.explanation}</p>
                                
                                <div class="my-4 space-y-2">
                                    ${explanationImages.map(url => `
                                        <img src="${url}" class="rounded-lg max-h-48 border" onerror="this.style.display='none'">
                                    `).join('')}
                                </div>

                            </div>
                            <div class="text-right mt-4">
                                <a href="#" class="text-indigo-600 hover:text-indigo-900 edit-btn">Edit</a>
                                <a href="#" class="text-red-600 hover:text-red-900 ml-4 delete-btn">Delete</a>
                            </div>
                        </div>`;
                    questionListEl.innerHTML += questionCard;
                });
            } catch (error) {
                console.error("Error loading questions:", error);
                showMessage(error.message, true);
                loadingStateEl.textContent = "Error loading questions.";
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const { data: userData, error } = await supabase.from('users').select('role').eq('id', session.user.id).single();
                if (error || !userData || (userData.role !== 'admin' && userData.role !== 'specialty_admin')) {
                    document.body.innerHTML = `<div class="text-center p-10"><h1 class="text-2xl font-bold text-red-600">Access Denied</h1></div>`;
                    return;
                }
                loadQuestions();
            } else {
                window.location.href = 'index.html';
            }
        });

        addQuestionButton.addEventListener('click', () => {
            document.getElementById('questionId').value = '';
            modalTitle.textContent = "Add New Question";
            openModal(questionModal);
        });

        questionForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const saveBtn = document.getElementById('saveButton');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            
            const id = document.getElementById('questionId').value;
            const options = [
                document.getElementById('optionA').value, document.getElementById('optionB').value,
                document.getElementById('optionC').value, document.getElementById('optionD').value,
            ];
            const optionE = document.getElementById('optionE').value;
            if (optionE) options.push(optionE);

            try {
                const { data: chapterInfo, error: chapterError } = await supabase.from('chapters').select('discipline_id').eq('id', chapterId).single();
                if (chapterError) throw chapterError;

const typedQuestionImageUrls = parseImageUrlsFromTextarea(document.getElementById('questionImageUrl').value);
const uploadedQuestionImageUrls = await uploadMultipleImages(
    document.getElementById('questionImageUpload').files,
    chapterId,
    'q'
);
const finalQuestionImageUrls = [...typedQuestionImageUrls, ...uploadedQuestionImageUrls];

const typedExplanationImageUrls = parseImageUrlsFromTextarea(document.getElementById('explanationImageUrl').value);
const uploadedExplanationImageUrls = await uploadMultipleImages(
    document.getElementById('explanationImageUpload').files,
    chapterId,
    'expl'
);
const finalExplanationImageUrls = [...typedExplanationImageUrls, ...uploadedExplanationImageUrls];

const questionData = {
    questionNumber: Number(document.getElementById('questionNumber').value),
    question: document.getElementById('questionText').value,
    imageUrl: finalQuestionImageUrls[0] || null,
    imageUrls: finalQuestionImageUrls.length > 0 ? finalQuestionImageUrls : null,
    options: options.filter(Boolean),
    correctAnswerIndex: Number(document.getElementById('correctAnswer').value),
    explanation: document.getElementById('explanation').value,
    explanationImageUrl: finalExplanationImageUrls[0] || null,
    explanationImageUrls: finalExplanationImageUrls.length > 0 ? finalExplanationImageUrls : null,
    book_id: bookId,
    chapter_id: chapterId,
    discipline_id: chapterInfo.discipline_id
};

                let error;
                if (id) {
                    ({ error } = await supabase.from('questions').update(questionData).eq('id', id));
                } else {
                    ({ error } = await supabase.from('questions').insert([questionData]));
                }
                if (error) throw error;
                
              showMessage(id ? "Question updated successfully!" : "Question added successfully!");
                closeModal(questionModal);
                loadQuestions();
            } catch (err) {
                 console.error("Error saving question: ", err);
                 showMessage(`Failed to save question. ${err.message}`, true);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Question';
            }
        });

     importForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const importBtn = document.getElementById('importButton');
            importBtn.disabled = true;
            importBtn.textContent = 'Importing...';

            try {
                const { data: chapterInfo, error: chapterError } = await supabase.from('chapters').select('discipline_id').eq('id', chapterId).single();
                if (chapterError) throw chapterError;

                const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
                if (chapterInfo.discipline_id && !uuidRegex.test(chapterInfo.discipline_id)) {
                    throw new Error(`The parent chapter has an invalid Discipline ID. Go to 'Manage Chapters' and re-assign the correct discipline before importing.`);
                }

                const parsedData = JSON.parse(jsonInput.value);
                if (!parsedData.questions || !Array.isArray(parsedData.questions)) {
                    throw new Error('Invalid JSON format. It must be an object with a "questions" array.');
                }

                // --- THIS IS THE CORRECTED MAPPING LOGIC ---
              const questionsToInsert = parsedData.questions.map(q => {
                    if (q.questionNumber === undefined || !q.question || !q.options || q.correctAnswerIndex === undefined || !q.explanation) {
                        throw new Error(`A question in the JSON (Q# ${q.questionNumber}) is missing a required field.`);
                    }
                    return {
                        questionNumber: q.questionNumber,
                        question: q.question,
                        options: q.options,
                        correctAnswerIndex: q.correctAnswerIndex,
                        explanation: q.explanation,
                        // Handles single image
                        imageUrl: q.imageUrl || null,
                        // HANDLES MULTIPLE QUESTION IMAGES
                        imageUrls: q.imageUrls || null,
                        // Handles single explanation image
                        explanationImageUrl: q.explanationImageUrl || null,
                        // HANDLES MULTIPLE EXPLANATION IMAGES
                        explanationImageUrls: q.explanationImageUrls || null,
                        book_id: bookId,
                        chapter_id: chapterId,
                        discipline_id: chapterInfo.discipline_id
                    };
                });
                // --- END OF FIX ---

                const { error: insertError } = await supabase.from('questions').insert(questionsToInsert);
                if (insertError) throw insertError;

                showMessage(`${questionsToInsert.length} questions imported successfully!`, false);
                closeModal(importModal);
                loadQuestions();

            } catch (error) {
                console.error("Import error:", error);
                showMessage(`Import failed: ${error.message}`, true);
            } finally {
                importBtn.disabled = false;
                importBtn.textContent = 'Import Questions';
            }
        });
        questionListEl.addEventListener('click', async (e) => {
            const target = e.target;
            const questionCard = target.closest('[data-id]');
            if (!questionCard) return;
            const questionId = questionCard.dataset.id;

            if (target.classList.contains('delete-btn')) {
                e.preventDefault();
                if (confirm('Are you sure you want to delete this question?')) {
                    const { error } = await supabase.from('questions').delete().eq('id', questionId);
                    if (error) {
                        showMessage('Failed to delete question.', true);
                    } else {
                        showMessage('Question deleted successfully.');
                        loadQuestions();
                    }
                }
            }

            if (target.classList.contains('edit-btn')) {
                e.preventDefault();
                const { data, error } = await supabase.from('questions').select('*').eq('id', questionId).single();
                if (error || !data) {
                    showMessage('Could not fetch question details.', true);
                    return;
                }
                document.getElementById('questionId').value = questionId;
                document.getElementById('questionNumber').value = data.questionNumber;
                document.getElementById('questionText').value = data.question;
                document.getElementById('questionImageUrl').value = (
    Array.isArray(data.imageUrls) && data.imageUrls.length > 0
        ? data.imageUrls
        : (data.imageUrl ? [data.imageUrl] : [])
).join('\n');
                document.getElementById('optionA').value = data.options[0] || '';
                document.getElementById('optionB').value = data.options[1] || '';
                document.getElementById('optionC').value = data.options[2] || '';
                document.getElementById('optionD').value = data.options[3] || '';
                document.getElementById('optionE').value = data.options[4] || '';
                document.getElementById('correctAnswer').value = data.correctAnswerIndex;
                document.getElementById('explanation').value = data.explanation;
                document.getElementById('explanationImageUrl').value = (
    Array.isArray(data.explanationImageUrls) && data.explanationImageUrls.length > 0
        ? data.explanationImageUrls
        : (data.explanationImageUrl ? [data.explanationImageUrl] : [])
).join('\n');
                modalTitle.textContent = "Edit Question";
                openModal(questionModal);
            }
        });

        bulkImportButton.addEventListener('click', () => openModal(importModal));
        cancelImportButton.addEventListener('click', () => closeModal(importModal));
        cancelButton.addEventListener('click', () => closeModal(questionModal));
        
        async function handleLogout() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }
        logoutButton.addEventListener('click', handleLogout);

    </script>
</body>
</html>
