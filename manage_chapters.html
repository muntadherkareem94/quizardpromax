<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizard - Manage Chapters</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 to-purple-700 min-h-screen">
    <header class="bg-white shadow-md py-4 px-6 md:px-10 flex justify-between items-center z-10 sticky top-0">
        <div class="flex items-center">
            <a href="admin_dashboard.html" class="text-gray-600 hover:text-purple-600 mr-4"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg></a>
            <h1 class="text-2xl font-bold text-gray-800">Manage Chapters</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span id="usernameDisplay" class="text-gray-700 font-medium hidden sm:block"></span>
           <button id="logoutButton" class="transition-transform hover:scale-110" title="Logout">
                <img src="images/logout.png" alt="Logout" class="h-8 w-8" onerror="this.onerror=null;this.src='https://placehold.co/32x32/FFFFFF/000000?text=L';">
            </button>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 md:py-12">
        <h2 id="bookTitle" class="text-4xl font-extrabold text-white mb-8 text-center drop-shadow-lg">Loading...</h2>
        <div class="text-center mb-8">
            <button id="addChapterButton" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-5 rounded-lg shadow">Add New Chapter</button>
        </div>
        <div id="chaptersGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 p-4">
            <!-- Chapter cards will be loaded here by JavaScript -->
        </div>
        <div id="messageBox" class="hidden fixed bottom-5 right-5 mt-6 px-4 py-3 rounded-lg shadow-lg" role="alert"></div>
    </main>

    <div id="chapterModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 hidden overflow-y-auto">
        <div class="bg-white rounded-lg shadow-2xl p-8 max-w-lg w-full my-8">
            <h3 id="chapterModalTitle" class="text-2xl font-bold text-gray-800 mb-6">Add New Chapter</h3>
            <form id="chapterForm" class="space-y-4">
                <input type="hidden" id="chapterId">
                <div>
                    <label for="chapterNumber" class="block text-sm font-medium text-gray-700">Chapter Number</label>
                    <input type="number" id="chapterNumber" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500">
                </div>
                <div>
                    <label for="chapterName" class="block text-sm font-medium text-gray-700">Chapter Name</label>
                    <input type="text" id="chapterName" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500">
                </div>
               <div>
                    <label for="chapterDiscipline" class="block text-sm font-medium text-gray-700">Discipline (Optional)</label>
                    <select id="chapterDiscipline" required class="mt-1 block w-full w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500">
                        <option value="">None</option>
                        <!-- Options populated by JS -->
                    </select>
                </div>
                <div>
                    <label for="chapterLinkedSpecialty" class="block text-sm font-medium text-gray-700">Link to Another Specialty (Optional)</label>
                    <select id="chapterLinkedSpecialty" class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">None</option>
                        <!-- Options populated by JS -->
                    </select>
                </div>
                <div>
                    <label for="chapterDescription" class="block text-sm font-medium text-gray-700">Description (Optional)</label>
                    <textarea id="chapterDescription" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500"></textarea>
                </div>
                <div>
    <label for="chapterIsFree" class="flex items-center">
        <input type="checkbox" id="chapterIsFree" class="h-4 w-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500">
        <span class="ml-2 text-sm font-medium text-gray-700">Make this chapter free?</span>
    </label>
</div>
                <div class="flex justify-end pt-4">
                    <button type="button" id="cancelChapterButton" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg mr-3">Cancel</button>
                    <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded-lg">Save Chapter</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        // --- Supabase SDK Import ---
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        // --- Supabase Configuration ---
        const SUPABASE_URL = 'https://ftcttxpmuqhqtbcdwgtr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0Y3R0eHBtdXFocXRiY2R3Z3RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU4OTg5MDQsImV4cCI6MjA3MTQ3NDkwNH0.AR3qXatnIZZSwGu_E1tH7elEyPIXS-zTFrd0b-YKqjg';

        // --- Initialize Supabase ---
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- DOM Element References ---
        const dom = {
            usernameDisplay: document.getElementById('usernameDisplay'),
            logoutButton: document.getElementById('logoutButton'),
            bookTitle: document.getElementById('bookTitle'),
            chaptersGrid: document.getElementById('chaptersGrid'),
            messageBox: document.getElementById('messageBox'),
            addChapterButton: document.getElementById('addChapterButton'),
            chapterModal: document.getElementById('chapterModal'),
            chapterForm: document.getElementById('chapterForm'),
            cancelChapterButton: document.getElementById('cancelChapterButton'),
            disciplineDropdown: document.getElementById('chapterDiscipline'),
            linkedSpecialtyDropdown: document.getElementById('chapterLinkedSpecialty'),
        };

        // --- Global State ---
        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('bookId');
        let disciplines = [];
        let originalBookData = null; // Store original book data

        // --- Helper Functions (Copied from original file) ---
        const medicalSpecialties = {
            "Internal Medicine": ["Internal Medicine - General", "Cardiology", "Endocrinology", "Gastroenterology", "Hematology", "Infectious Disease", "Nephrology", "Oncology", "Pulmonology", "Rheumatology"],
            "Surgery": ["General Surgery", "Cardiothoracic Surgery", "Neurosurgery", "Orthopedic Surgery", "Otolaryngology (ENT)", "Pediatric Surgery", "Plastic Surgery", "Urology", "Vascular Surgery"],
            "Pediatrics": ["Pediatrics - General", "Neonatology", "Pediatric Cardiology", "Pediatric Endocrinology", "Pediatric Gastroenterology"],
            "Obstetrics & Gynecology": ["Obstetrics & Gynecology - General", "Gynecologic Oncology", "Maternal-Fetal Medicine", "Reproductive Endocrinology and Infertility"],
            "Other Major Specialties": ["Anesthesiology", "Dermatology", "Emergency Medicine", "Family Medicine", "Neurology", "Ophthalmology", "Pathology", "Psychiatry", "Radiology"]
        };

        function populateSpecialtyDropdown(selectElement) {
            selectElement.innerHTML = '<option value="">None</option>';
            for (const group in medicalSpecialties) {
                const optgroup = document.createElement('optgroup');
                optgroup.label = group;
                medicalSpecialties[group].forEach(specialty => {
                    const option = document.createElement('option');
                    option.value = specialty;
                    option.textContent = specialty;
                    optgroup.appendChild(option);
                });
                selectElement.appendChild(optgroup);
            }
        }

        function showMessage(message, isError = false) {
            dom.messageBox.textContent = message;
            dom.messageBox.className = `fixed bottom-5 right-5 mt-6 px-4 py-3 rounded-lg shadow-lg ${isError ? 'bg-red-100 border-red-400 text-red-700' : 'bg-green-100 border-green-400 text-green-700'}`;
            dom.messageBox.classList.remove('hidden');
            setTimeout(() => dom.messageBox.classList.add('hidden'), 4000);
        }

        // --- MIGRATED Supabase Data Functions ---
        async function fetchDisciplines() {
            try {
                const { data, error } = await supabase.from('disciplines').select('*');
                if (error) throw error;
                disciplines = data;
                
                dom.disciplineDropdown.innerHTML = '<option value="">Select a discipline...</option>';
                disciplines.forEach(disc => {
                    const option = document.createElement('option');
                    option.value = disc.id;
                    option.textContent = disc.name;
                    dom.disciplineDropdown.appendChild(option);
                });
            } catch (error) {
                showMessage("Could not load disciplines.", true);
            }
        }

      // This is the new code that saves the book data for later use.
async function loadBookAndChapters() {
    if (!bookId) {
        dom.bookTitle.textContent = "Book Not Found";
        return;
    }

    try {
        const { data: bookData, error: bookError } = await supabase
            .from('books')
            .select('*')
            .eq('id', bookId)
            .single();
        if (bookError) throw bookError;
        
        originalBookData = bookData; // Make sure this line is here and correct
        dom.bookTitle.textContent = `${originalBookData.title} - Chapters`;

                const { data: chapters, error: chaptersError } = await supabase
                    .from('chapters')
                    .select('*')
                    .eq('book_id', bookId);
                if (chaptersError) throw chaptersError;

                chapters.sort((a, b) => a.chapterNumber - b.chapterNumber);

                const chaptersContainer = dom.chaptersGrid;
                chaptersContainer.innerHTML = '';

                if (chapters.length === 0) {
                    chaptersContainer.innerHTML = '<p class="text-white text-center col-span-full bg-black/20 p-4 rounded-lg">No chapters found for this book yet.</p>';
                    return;
                }

             chapters.forEach(chapter => {
    // FIX: Changed chapter.disciplineId to chapter.discipline_id
    const disciplineName = disciplines.find(d => d.id === chapter.discipline_id)?.name || 'N/A';
    const linkedSpecialtyName = chapter.linkedSpecialty || 'None';
    const card = document.createElement('div');
    card.className = 'bg-white/90 rounded-xl shadow-lg p-6 flex flex-col space-y-4';
    card.dataset.chapterId = chapter.id;

    card.innerHTML = `
        <div>
            <h3 class="text-xl font-bold text-gray-800">Ch. ${chapter.chapterNumber}: ${chapter.name}</h3>
            <p class="text-sm text-gray-600">Discipline: <span class="font-semibold">${disciplineName}</span></p>
            <p class="text-sm text-gray-600">Linked to: <span class="font-semibold text-indigo-600">${linkedSpecialtyName}</span></p>
            <p class="text-sm text-gray-500 mt-1">${chapter.description || ''}</p>
        </div>
        <div class="mt-auto pt-4 border-t border-gray-200 flex justify-between items-center gap-2">
            <a href="manage_questions.html?bookId=${bookId}&chapterId=${chapter.id}" class="text-sm bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-3 rounded-md transition-colors text-center flex-grow">
                Manage Questions
            </a>
            <div class="flex-shrink-0 flex gap-2">
                <button data-action="edit" class="p-2 bg-gray-200 hover:bg-gray-300 rounded-md" title="Edit Chapter">
                     <svg class="w-5 h-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.5L15.232 5.232z"></path></svg>
                </button>
                <button data-action="delete" class="p-2 bg-red-100 hover:bg-red-200 rounded-md" title="Delete Chapter">
                     <svg class="w-5 h-5 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>
        </div>
    `;
    chaptersContainer.appendChild(card);
});
            } catch (error) {
                console.error("Error loading book and chapters:", error);
                showMessage("An error occurred while loading the page.", true);
            }
        }

        async function createOrUpdateLinkedBook(chapterId, chapterData, linkedSpecialty) {
            const virtualBookData = {
                title: `${originalBookData.title} - ${chapterData.name}`,
                description: `A chapter from the book '${originalBookData.title}', relevant to ${linkedSpecialty}.`,
                speciality: linkedSpecialty,
                image: originalBookData.image,
                isVirtual: true,
                originalBookId: bookId,
                linkedChapterId: chapterId
            };

            const { data: existing, error: findError } = await supabase
                .from('books')
                .select('id')
                .eq('linkedChapterId', chapterId)
                .maybeSingle();

            if (findError) throw findError;

            if (existing) {
                const { error } = await supabase.from('books').update(virtualBookData).eq('id', existing.id);
                if (error) throw error;
                showMessage("Linked book updated successfully.");
            } else {
                const { error } = await supabase.from('books').insert([virtualBookData]);
                if (error) throw error;
                showMessage("Linked book created successfully.");
            }
        }

        async function deleteLinkedBook(chapterId) {
            const { error } = await supabase
                .from('books')
                .delete()
                .eq('linkedChapterId', chapterId);
            if (error) throw error;
            showMessage("Chapter link removed and virtual book deleted.");
        }

        // --- MIGRATED Authentication Check ---
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const user = session.user;
                dom.usernameDisplay.textContent = `Welcome, ${user.email}`;
                populateSpecialtyDropdown(dom.linkedSpecialtyDropdown);
                await fetchDisciplines();
                await loadBookAndChapters();
                // setupActivityListeners(); // Inactivity timer can be added back if needed
            } else {
                window.location.href = 'index.html';
            }
        });
        
       // This is the new code that sets the default based on the parent book.
dom.addChapterButton.addEventListener('click', () => {
    dom.chapterForm.reset();
    document.getElementById('chapterId').value = '';
    document.getElementById('chapterModalTitle').textContent = "Add New Chapter";

    // THE FIX: Set the checkbox based on the parent book's access level.
    if (originalBookData) {
        // If the parent book is 'free', the chapter should default to free.
        // Otherwise (if premium or purchasable), it should default to NOT free.
        document.getElementById('chapterIsFree').checked = (originalBookData.access_level === 'free');
    }

    dom.chapterModal.classList.remove('hidden');
});

        dom.chapterForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const chapterId = document.getElementById('chapterId').value;
            const linkedSpecialty = dom.linkedSpecialtyDropdown.value;

// Replace the old chapterData object with this one
const chapterData = {
    chapterNumber: Number(document.getElementById('chapterNumber').value),
    name: document.getElementById('chapterName').value,
    description: document.getElementById('chapterDescription').value,
    discipline_id: document.getElementById('chapterDiscipline').value || null,
    linkedSpecialty: document.getElementById('chapterLinkedSpecialty').value || null,
    book_id: bookId,
    // ADD THIS NEW LINE
    is_free: document.getElementById('chapterIsFree').checked 
};

            try {
                let currentChapterId = chapterId;
                let error;

                if (chapterId) {
                    ({ error } = await supabase.from('chapters').update(chapterData).eq('id', chapterId));
                } else {
                    const { data, error: insertError } = await supabase.from('chapters').insert([chapterData]).select().single();
                    if (insertError) throw insertError;
                    currentChapterId = data.id;
                }
                if (error) throw error;

                if (linkedSpecialty) {
                    await createOrUpdateLinkedBook(currentChapterId, chapterData, linkedSpecialty);
                } else {
                    await deleteLinkedBook(currentChapterId);
                }
                
                sessionStorage.removeItem('masterBookList');
                dom.chapterModal.classList.add('hidden');
                loadBookAndChapters();
            } catch (err) {
                console.error(err);
                showMessage("Failed to save chapter.", true);
            }
        });

        dom.chaptersGrid.addEventListener('click', async (event) => {
            const targetButton = event.target.closest('button[data-action]');
            if (!targetButton) return;

            const action = targetButton.dataset.action;
            const chapterCard = targetButton.closest('[data-chapter-id]');
            const chapterId = chapterCard.dataset.chapterId;
            
      // --- In manage_chapters.html, inside the chaptersGrid.addEventListener ---

if (action === 'edit') {
    const { data, error } = await supabase
        .from('chapters')
        .select('*')
        .eq('id', chapterId)
        .single();
    
    if (error) { 
        showMessage("Could not fetch chapter details.", true); 
        return; 
    }

    document.getElementById('chapterId').value = chapterId;
    document.getElementById('chapterModalTitle').textContent = 'Edit Chapter';
    document.getElementById('chapterNumber').value = data.chapterNumber;
    document.getElementById('chapterName').value = data.name;
    document.getElementById('chapterDescription').value = data.description || '';
    
    // THIS IS THE CORRECTED LINE
    document.getElementById('chapterDiscipline').value = data.discipline_id || data.disciplineId || '';
document.getElementById('chapterIsFree').checked = data.is_free;

    dom.linkedSpecialtyDropdown.value = data.linkedSpecialty || '';
    dom.chapterModal.classList.remove('hidden');
}
            
            if (action === 'delete') {
                if (confirm('Are you sure you want to delete this chapter and all its questions? This will also remove any linked virtual book. This cannot be undone.')) {
                    try {
                        await deleteLinkedBook(chapterId);

                        // Also delete questions associated with the chapter
                        await supabase.from('questions').delete().eq('chapter_id', chapterId);

                        // Then, delete the chapter itself
                        await supabase.from('chapters').delete().eq('id', chapterId);

                        showMessage("Chapter deleted successfully!");
                        loadBookAndChapters();
                    } catch (e) {
                        showMessage("Error deleting chapter.", true);
                    }
                }
            }
        });

        dom.logoutButton.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
