<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="view-transition" content="same-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizard - Manage Duplicates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Quizard">
    <link rel="apple-touch-icon" href="images/icons/icon-192x192.png">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <header class="bg-white shadow-md py-4 px-6 md:px-10 flex justify-between items-center z-10 sticky top-0">
        <div class="flex items-center">
            <h1 class="text-2xl font-bold text-gray-800">Duplicate Question Finder</h1>
        </div>
        <div class="flex items-center space-x-4">
            <a href="admin_dashboard.html" class="text-gray-600 hover:text-purple-600 font-medium transition duration-200">Back to Admin</a>
            <button id="logoutButton" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow transition duration-300">Logout</button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-5xl flex-grow">
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">System Scan</h2>
                <button id="scanButton" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-lg shadow transition">
                    Scan for Duplicates
                </button>
            </div>
            <p class="text-gray-600 text-sm">Click the button above to scan your entire database. Questions with identical text (ignoring punctuation and spaces) will be flagged below.</p>
        </div>

        <div id="loadingState" class="hidden text-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600 mx-auto mb-4"></div>
            <p class="text-gray-600 font-medium">Scanning database... this might take a moment.</p>
        </div>

        <div id="resultsContainer" class="space-y-8">
            </div>
    </main>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        const scanButton = document.getElementById('scanButton');
        const loadingState = document.getElementById('loadingState');
        const resultsContainer = document.getElementById('resultsContainer');

        // Check if Admin
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            const { data: userData } = await supabase.from('users').select('role').eq('id', session.user.id).single();
            if (!userData || userData.role !== 'admin') {
                document.body.innerHTML = `<div class="text-center p-10"><h1 class="text-2xl font-bold text-red-600">Access Denied</h1></div>`;
            }
        });

        document.getElementById('logoutButton').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });

        // --- Core Logic: Scan for Duplicates ---
        scanButton.addEventListener('click', async () => {
            scanButton.disabled = true;
            loadingState.classList.remove('hidden');
            resultsContainer.innerHTML = '';

            try {
                // 1. Fetch ALL Questions & Chapters
                const { data: questions, error: qError } = await supabase.from('questions').select('id, question, chapter_id, questionNumber');
                const { data: chapters, error: cError } = await supabase.from('chapters').select('id, name, chapterNumber, books(title)');
                
                if (qError || cError) throw new Error("Failed to load database content.");

                const chapterMap = new Map(chapters.map(c => [c.id, { 
                    name: `Ch. ${c.chapterNumber}: ${c.name}`, 
                    book: c.books?.title || 'Unknown Book' 
                }]));

                // 2. Normalize and Group by Question Text
                const textGroups = new Map();
                questions.forEach(q => {
                    if (!q.question) return;
                    // Normalize: lowercase, remove all non-alphanumeric characters (spaces, commas, etc.)
                    const normalized = q.question.toLowerCase().replace(/[\W_]+/g, '');
                    if (!textGroups.has(normalized)) textGroups.set(normalized, []);
                    textGroups.get(normalized).push(q);
                });

                // 3. Filter only groups that have duplicates (> 1)
                const duplicateGroups = Array.from(textGroups.values()).filter(group => group.length > 1);

                if (duplicateGroups.length === 0) {
                    resultsContainer.innerHTML = `<div class="bg-green-100 text-green-800 p-6 rounded-xl text-center font-bold text-lg border border-green-300">Fantastic! No duplicate questions found.</div>`;
                    return;
                }

                // 4. Organize by Chapter
                const chapterDuplicates = new Map(); // chapterId -> array of { targetQuestion, duplicatesIn: [] }

                duplicateGroups.forEach(group => {
                    group.forEach(currentQ => {
                        const others = group.filter(q => q.id !== currentQ.id);
                        if (!chapterDuplicates.has(currentQ.chapter_id)) {
                            chapterDuplicates.set(currentQ.chapter_id, []);
                        }
                        chapterDuplicates.get(currentQ.chapter_id).push({
                            questionId: currentQ.id,
                            questionText: currentQ.question,
                            qNumber: currentQ.questionNumber,
                            conflicts: others
                        });
                    });
                });

                // 5. Render to UI
                renderResults(chapterDuplicates, chapterMap);

            } catch (error) {
                console.error(error);
                resultsContainer.innerHTML = `<p class="text-red-600 text-center font-bold">Error: ${error.message}</p>`;
            } finally {
                loadingState.classList.add('hidden');
                scanButton.disabled = false;
            }
        });

        // --- Render UI ---
        function renderResults(chapterMapData, globalChapterMap) {
            resultsContainer.innerHTML = '';

            // Convert Map to Array and Sort by Chapter Name
            const sortedChapters = Array.from(chapterMapData.entries()).sort((a, b) => {
                const nameA = globalChapterMap.get(a[0])?.name || '';
                const nameB = globalChapterMap.get(b[0])?.name || '';
                return nameA.localeCompare(nameB);
            });

            sortedChapters.forEach(([chapterId, duplicateList]) => {
                const chapterInfo = globalChapterMap.get(chapterId);
                if (!chapterInfo) return;

                const section = document.createElement('div');
                section.className = "bg-white rounded-xl shadow border border-gray-200 overflow-hidden";
                
                // Chapter Header
                const header = document.createElement('div');
                header.className = "bg-gray-50 px-6 py-4 border-b border-gray-200";
                header.innerHTML = `
                    <h3 class="text-lg font-bold text-gray-800">${chapterInfo.name}</h3>
                    <p class="text-xs text-purple-600 font-bold uppercase tracking-wider">${chapterInfo.book}</p>
                `;
                section.appendChild(header);

                // Duplicate List for this Chapter
                const listDiv = document.createElement('div');
                listDiv.className = "divide-y divide-gray-100";

                duplicateList.forEach(item => {
                    const row = document.createElement('div');
                    row.className = "p-6 hover:bg-gray-50 transition flex flex-col md:flex-row justify-between items-start gap-4";
                    
                    // The other locations where this question lives
                    const conflictLabels = item.conflicts.map(c => {
                        const conflictCh = globalChapterMap.get(c.chapter_id);
                        return `<span class="inline-block bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded border border-yellow-200 mt-1 mr-1">
                            Also in: ${conflictCh ? conflictCh.name : 'Unknown'} (Q${c.questionNumber})
                        </span>`;
                    }).join('');

                    row.innerHTML = `
                        <div class="flex-1">
                            <span class="font-bold text-gray-700 mr-2">Q${item.qNumber}:</span>
                            <span class="text-gray-800">${item.questionText}</span>
                            <div class="mt-2 flex flex-wrap gap-1">
                                ${conflictLabels}
                            </div>
                        </div>
                        <button class="delete-dup-btn flex-shrink-0 bg-red-100 hover:bg-red-600 text-red-700 hover:text-white font-semibold py-2 px-4 rounded transition border border-red-200 hover:border-red-600" data-id="${item.questionId}">
                            Delete from this Chapter
                        </button>
                    `;
                    listDiv.appendChild(row);
                });

                section.appendChild(listDiv);
                resultsContainer.appendChild(section);
            });

            // Attach Delete Listeners
            document.querySelectorAll('.delete-dup-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const qId = e.target.getAttribute('data-id');
                    if(confirm("Are you sure you want to delete this specific question instance? This action cannot be undone.")) {
                        e.target.disabled = true;
                        e.target.textContent = "Deleting...";
                        try {
                            const { error } = await supabase.from('questions').delete().eq('id', qId);
                            if (error) throw error;
                            // Remove the row from the UI instantly
                            e.target.closest('div.p-6').remove();
                        } catch (err) {
                            alert("Error deleting question: " + err.message);
                            e.target.disabled = false;
                            e.target.textContent = "Delete from this Chapter";
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
